name: Deploy to Hostinger

# Publishes the site to Hostinger over FTPS on every push to main.
# Set these repo secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. ftp://147.93.x.x  or  ftp://yourdomain.com
#   FTP_USERNAME  the FTP account username from hPanel -> Files -> FTP Accounts
#   FTP_PASSWORD  that FTP account's password
# server-dir must match where the domain is served from (usually public_html/).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/node_modules/**
